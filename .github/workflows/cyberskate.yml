# Skate 3 in Cyberpunk 2077: the adapter's tests, the RED4ext plugin, the
# Skate 3 converter and the installable mod folder.
name: CyberSkate

on:
  push:
    paths:
      - "cyberpunk/**"
      - "skate/**"
      - ".github/workflows/cyberskate.yml"
  pull_request:
    paths:
      - "cyberpunk/**"
      - "skate/**"
      - ".github/workflows/cyberskate.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The revision of SK8-ENGINE/skate-3-rust-engine that skate/crates came from.
  SKATE_ENGINE_REVISION: cb7968930f14dad38457e98720d1a274e469eec2

jobs:
  adapter:
    name: Adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cyberpunk
      - name: Test the Cyberpunk adapter
        working-directory: cyberpunk
        run: cargo test --release -p cyberskate
      - name: Check the CET mod's Lua
        run: |
          sudo apt-get install -y luajit
          find cyberpunk/mod -name '*.lua' -print0 | xargs -0 -n1 luajit -bl > /dev/null

  windows:
    name: Plugin and mod package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cyberpunk
      - name: Build the RED4ext plugin
        working-directory: cyberpunk
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release -p cyberskate-red4ext -p cyberskate-board
      - name: Check the plugin's RED4ext entry points
        shell: pwsh
        run: |
          $exports = & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-exports cyberpunk/target/release/CyberSkate.dll
          foreach ($symbol in 'Query', 'Main', 'Supports') {
            if (-not ($exports -match "Name: $symbol$")) { throw "CyberSkate.dll does not export $symbol" }
          }
          ($exports -match 'Name: ') -join "`n"
          (Get-Item cyberpunk/target/release/CyberSkate.dll).Length
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the Skate 3 converter
        id: converter
        continue-on-error: true
        shell: pwsh
        run: |
          $engine = Join-Path $env:RUNNER_TEMP 'skate-engine'
          git init -q $engine
          git -C $engine remote add origin https://github.com/SK8-ENGINE/skate-3-rust-engine
          git -C $engine fetch -q --depth 1 origin $env:SKATE_ENGINE_REVISION
          git -C $engine checkout -q FETCH_HEAD
          python -m pip install -r (Join-Path $engine 'tools\requirements-setup.txt')
          $out = Join-Path $env:RUNNER_TEMP 'converter'
          ./skate/converter/build.ps1 -SkateEngine $engine -Out $out
          # The converter bundles Python, NumPy, Pillow and the engine's vendored tools.
          $staged = Join-Path $env:RUNNER_TEMP 'converter-licenses'
          New-Item -ItemType Directory -Force $staged | Out-Null
          Copy-Item (Join-Path $env:pythonLocation 'LICENSE.txt') (Join-Path $staged 'Python-LICENSE.txt')
          python -c "import importlib.metadata as m, pathlib, shutil, sys; out = pathlib.Path(sys.argv[1]); [shutil.copy(f.locate(), out / str(f).replace('/', '_')) for name in ('numpy', 'pillow') for f in m.distribution(name).files if f.name.upper().startswith(('LICENSE', 'COPYING'))]" $staged
          foreach ($license in Get-ChildItem (Join-Path $engine 'tools\vendor') -Recurse -File -Filter 'LICENSE*') {
            Copy-Item $license.FullName (Join-Path $staged ($license.Directory.Name + '-' + $license.Name))
          }
          Get-ChildItem $staged | ForEach-Object Name
          "exe=$out\iw4l-skate-convert.exe" >> $env:GITHUB_OUTPUT
          "licenses=$staged" >> $env:GITHUB_OUTPUT
      - name: Package
        shell: pwsh
        run: |
          $licenses = @()
          if ('${{ steps.converter.outputs.licenses }}') {
            $licenses = (Get-ChildItem '${{ steps.converter.outputs.licenses }}' -File).FullName
          }
          ./cyberpunk/scripts/package.ps1 `
            -Plugin cyberpunk/target/release/CyberSkate.dll `
            -BoardTool cyberpunk/target/release/cyberskate-board.exe `
            -Converter '${{ steps.converter.outputs.exe }}' `
            -ConverterLicenses $licenses `
            -Out "$env:RUNNER_TEMP\CyberSkate"
      - name: Install into a stand-in game folder
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP 'Cyberpunk 2077'
          foreach ($file in 'bin\x64\Cyberpunk2077.exe', 'red4ext\RED4ext.dll', 'bin\x64\plugins\cyber_engine_tweaks.asi') {
            New-Item -ItemType File -Force (Join-Path $game $file) | Out-Null
          }
          & "$env:RUNNER_TEMP\CyberSkate\Install-CyberSkate.ps1" -Game $game -SkipSkate -NoPrompt
          if ($LASTEXITCODE) { throw "installer exited with $LASTEXITCODE" }
          foreach ($file in 'bin\x64\plugins\cyber_engine_tweaks\mods\CyberSkate\init.lua',
                            'bin\x64\plugins\cyber_engine_tweaks\mods\CyberSkate\modules\rider.lua',
                            'red4ext\plugins\CyberSkate\CyberSkate.dll',
                            'red4ext\plugins\CyberSkate\Setup-CyberSkate.ps1') {
            if (-not (Test-Path -LiteralPath (Join-Path $game $file))) { throw "installer left out $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CyberSkate
          path: ${{ runner.temp }}/CyberSkate
